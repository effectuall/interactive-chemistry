<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interative States of Matter - p5.js</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1a1a1a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #444;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            width: 280px;
        }

        .label-group {
            margin-bottom: 15px;
        }

        .label-group h2 {
            margin: 0;
            font-size: 1.2rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .state-name {
            font-size: 2rem;
            font-weight: bold;
            margin: 5px 0;
            color: #00d4ff;
        }

        .slider-container {
            width: 100%;
            margin-top: 20px;
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
        }

        .description {
            font-size: 0.9rem;
            color: #888;
            line-height: 1.4;
            margin-top: 10px;
        }

        canvas {
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>

    <div id="ui-container">
        <div class="label-group">
            <h2>Current State</h2>
            <div id="state-text" class="state-name">Solid</div>
        </div>

        <div class="label-group">
            <h2 id="temp-label">Heat Energy: 10%</h2>
            <div class="slider-container">
                <input type="range" id="temp-slider" min="0" max="100" value="10">
            </div>
        </div>

        <div id="description" class="description">
            Particles are locked in a tight lattice, vibrating slightly but maintaining a fixed shape.
        </div>
    </div>

    <script>
        let particles = [];
        const numParticles = 120;
        let slider;
        let stateText;
        let tempLabel;
        let descText;

        function setup() {
            // Create a responsive canvas
            const canvas = createCanvas(windowWidth, windowHeight);
            canvas.style('display', 'block');

            // Link UI elements
            slider = document.getElementById('temp-slider');
            stateText = document.getElementById('state-text');
            tempLabel = document.getElementById('temp-label');
            descText = document.getElementById('description');

            // Initialize particles
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle());
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        function draw() {
            background(15, 15, 20);

            let temp = parseInt(slider.value);
            updateUI(temp);

            // Simulation Logic
            for (let p of particles) {
                p.update(temp);
                p.checkEdges();
                p.display(temp);
            }
        }

        function updateUI(t) {
            tempLabel.innerText = `Heat Energy: ${t}%`;

            if (t < 25) {
                stateText.innerText = "Solid";
                stateText.style.color = "#4facfe";
                descText.innerText = "Particles are locked in a tight lattice, vibrating slightly but maintaining a fixed shape.";
            } else if (t < 75) {
                stateText.innerText = "Liquid";
                stateText.style.color = "#00f2fe";
                descText.innerText = "Particles move faster, breaking free from fixed positions to flow and take the shape of their container.";
            } else {
                stateText.innerText = "Gas";
                stateText.style.color = "#f093fb";
                descText.innerText = "High kinetic energy! Particles fly rapidly in all directions, filling the entire available volume.";
            }
        }

        class Particle {
            constructor() {
                this.pos = createVector(random(width), random(height));
                this.vel = p5.Vector.random2D();
                this.baseSize = 10;
                // 'Home' position for solid state lattice
                this.home = createVector(this.pos.x, this.pos.y);
            }

            update(temp) {
                if (temp < 25) {
                    // SOLID: Vibration around a fixed point
                    let vibrationScale = map(temp, 0, 25, 0.5, 3);
                    let noiseX = (noise(this.home.x, frameCount * 0.1) - 0.5) * vibrationScale;
                    let noiseY = (noise(this.home.y, frameCount * 0.1) - 0.5) * vibrationScale;
                    this.pos.set(this.home.x + noiseX, this.home.y + noiseY);
                } else {
                    // LIQUID & GAS: Free movement
                    // Speed mapping
                    let speed;
                    if (temp < 75) {
                        speed = map(temp, 25, 75, 1, 4); // Liquid speed
                        // Add some "gravity" or cohesion for liquid effect
                        this.vel.y += 0.05;
                    } else {
                        speed = map(temp, 75, 100, 4, 12); // Gas speed
                    }

                    this.pos.add(this.vel.copy().setMag(speed));

                    // Slowly drift 'home' back so if it freezes again it stays where it stopped
                    this.home.lerp(this.pos, 0.01);
                }
            }

            checkEdges() {
                if (this.pos.x < this.baseSize || this.pos.x > width - this.baseSize) {
                    this.vel.x *= -1;
                }
                if (this.pos.y < this.baseSize || this.pos.y > height - this.baseSize) {
                    this.vel.y *= -1;
                }

                // Keep inside bounds
                this.pos.x = constrain(this.pos.x, this.baseSize, width - this.baseSize);
                this.pos.y = constrain(this.pos.y, this.baseSize, height - this.baseSize);
            }

            display(temp) {
                noStroke();

                // Color Transition: Cold Blue -> Vibrant Cyan -> Hot Purple/Pink
                let col;
                if (temp < 50) {
                    col = lerpColor(color(79, 172, 254), color(0, 242, 254), temp / 50);
                } else {
                    col = lerpColor(color(0, 242, 254), color(240, 147, 251), (temp - 50) / 50);
                }

                // Add a glow effect based on temperature
                fill(red(col), green(col), blue(col), 180);
                ellipse(this.pos.x, this.pos.y, this.baseSize * 2);

                // Inner highlight
                fill(255, 200);
                ellipse(this.pos.x - 2, this.pos.y - 2, this.baseSize * 0.6);
            }
        }
    </script>
</body>

</html>
