<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D States of Matter Visualization</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #050505;
            font-family: sans-serif;
            color: white;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
            font-weight: bold;
        }

        button:hover {
            background: #555;
        }

        button.active {
            background: #007bff;
            border-color: #00aaff;
        }

        #info {
            margin-top: 15px;
            font-size: 0.9em;
            max-width: 250px;
            line-height: 1.4;
            color: #ccc;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <div id="ui">
        <h3>States of Matter</h3>
        <div class="btn-group">
            <button onclick="setState('solid')" id="btn-solid">Solid</button>
            <button onclick="setState('liquid')" id="btn-liquid">Liquid</button>
            <button onclick="setState('gas')" id="btn-gas">Gas</button>
            <button onclick="setState('plasma')" id="btn-plasma">Plasma</button>
        </div>
        <div id="info">In a <b>Solid</b>, particles are closely packed in a regular pattern and vibrate around fixed
            positions.</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, particles, particleSystem;
        let currentState = 'solid';
        const particleCount = 1000;
        const boxSize = 20;

        const descriptions = {
            solid: "In a <b>Solid</b>, particles are closely packed in a regular pattern and vibrate around fixed positions.",
            liquid: "In a <b>Liquid</b>, particles are close together but can move past each other, allowing the substance to flow.",
            gas: "In a <b>Gas</b>, particles are far apart and move randomly at high speeds, filling the entire container.",
            plasma: "In <b>Plasma</b>, particles are so energized that electrons are stripped from atoms, creating an ionized gas that glows."
        };

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 40;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Create particles
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            particles = [];
            for (let i = 0; i < particleCount; i++) {
                const p = {
                    x: (Math.random() - 0.5) * boxSize,
                    y: (Math.random() - 0.5) * boxSize,
                    z: (Math.random() - 0.5) * boxSize,
                    vx: (Math.random() - 0.5) * 0.1,
                    vy: (Math.random() - 0.5) * 0.1,
                    vz: (Math.random() - 0.5) * 0.1
                };
                particles.push(p);
                positions[i * 3] = p.x;
                positions[i * 3 + 1] = p.y;
                positions[i * 3 + 2] = p.z;

                colors[i * 3] = 0.5;
                colors[i * 3 + 1] = 0.7;
                colors[i * 3 + 2] = 1.0;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.6,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                map: createCircleTexture()
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);

            // Add a bounding box
            const boxGeo = new THREE.BoxGeometry(boxSize + 1, boxSize + 1, boxSize + 1);
            const edges = new THREE.EdgesGeometry(boxGeo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x444444 }));
            scene.add(line);

            window.addEventListener('resize', onWindowResize, false);
            setState('solid');
            animate();
        }

        function createCircleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function setState(state) {
            currentState = state;
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + state).classList.add('active');
            document.getElementById('info').innerHTML = descriptions[state];

            // Reset positions for specific patterns
            if (state === 'solid') {
                const side = Math.ceil(Math.pow(particleCount, 1 / 3));
                const spacing = 1.5;
                particles.forEach((p, i) => {
                    p.targetX = ((i % side) - side / 2) * spacing;
                    p.targetY = ((Math.floor(i / side) % side) - side / 2) * spacing;
                    p.targetZ = (Math.floor(i / (side * side)) - side / 2) * spacing;
                });
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const positions = particleSystem.geometry.attributes.position.array;
            const colors = particleSystem.geometry.attributes.color.array;

            particles.forEach((p, i) => {
                if (currentState === 'solid') {
                    // Vibrate around target
                    p.x = p.targetX + (Math.random() - 0.5) * 0.2;
                    p.y = p.targetY + (Math.random() - 0.5) * 0.2;
                    p.z = p.targetZ + (Math.random() - 0.5) * 0.2;
                    colors[i * 3] = 0.4; colors[i * 3 + 1] = 0.6; colors[i * 3 + 2] = 1.0;
                }
                else if (currentState === 'liquid') {
                    // Flow and settle at bottom
                    p.vx += (Math.random() - 0.5) * 0.01;
                    p.vy += (Math.random() - 0.5) * 0.01 - 0.005; // gravity-ish
                    p.vz += (Math.random() - 0.5) * 0.01;

                    p.x += p.vx; p.y += p.vy; p.z += p.vz;

                    // Keep within box and "pool" at bottom
                    const limit = boxSize / 2;
                    if (Math.abs(p.x) > limit) p.vx *= -1;
                    if (p.y < -limit) { p.y = -limit; p.vy *= -0.5; }
                    if (p.y > limit) { p.y = limit; p.vy *= -1; }
                    if (Math.abs(p.z) > limit) p.vz *= -1;

                    colors[i * 3] = 0.2; colors[i * 3 + 1] = 0.5; colors[i * 3 + 2] = 0.9;
                }
                else if (currentState === 'gas') {
                    // High speed random movement
                    const speed = 0.2;
                    p.x += p.vx * 2; p.y += p.vy * 2; p.z += p.vz * 2;

                    const limit = boxSize / 2;
                    if (Math.abs(p.x) > limit) p.vx *= -1;
                    if (Math.abs(p.y) > limit) p.vy *= -1;
                    if (Math.abs(p.z) > limit) p.vz *= -1;

                    colors[i * 3] = 0.7; colors[i * 3 + 1] = 0.7; colors[i * 3 + 2] = 0.7;
                }
                else if (currentState === 'plasma') {
                    // Energetic and glowing
                    p.x += p.vx * 5; p.y += p.vy * 5; p.z += p.vz * 5;
                    const limit = boxSize / 2;
                    if (Math.abs(p.x) > limit) p.vx *= -1;
                    if (Math.abs(p.y) > limit) p.vy *= -1;
                    if (Math.abs(p.z) > limit) p.vz *= -1;

                    // Color flickering
                    colors[i * 3] = 0.8 + Math.random() * 0.2;
                    colors[i * 3 + 1] = 0.2 + Math.random() * 0.4;
                    colors[i * 3 + 2] = 1.0;
                }

                positions[i * 3] = p.x;
                positions[i * 3 + 1] = p.y;
                positions[i * 3 + 2] = p.z;
            });

            particleSystem.geometry.attributes.position.needsUpdate = true;
            particleSystem.geometry.attributes.color.needsUpdate = true;
            particleSystem.rotation.y += 0.002;

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>

</html>
