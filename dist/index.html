<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemNexus | Chemistry Learning CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .active-nav {
      background: #eff6ff;
      color: #2563eb;
      border-right: 4px solid #2563eb;
    }

    .active-resource-tab {
      background: #2563eb;
      color: white;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
  </style>
  <script type="module" crossorigin src="/assets/index-CPlm-2-C.js"></script>
</head>

<body class="h-screen flex overflow-hidden">

  <div id="app" class="flex w-full h-full">
    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-white border-r border-slate-200 flex-shrink-0 hidden md:flex flex-col">
      <div class="p-6">
        <div class="flex items-center space-x-3 text-blue-600">
          <i class="fas fa-flask text-2xl"></i>
          <span class="font-bold text-xl tracking-tight text-slate-800">ChemNexus</span>
        </div>
      </div>

      <nav class="flex-1 px-4 space-y-1 overflow-y-auto custom-scrollbar">
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 mt-4 px-2">Main Menu</div>
        <button data-section="dashboard"
          class="nav-item w-full flex items-center px-4 py-3 text-slate-600 rounded-lg hover:bg-slate-50 transition-colors active-nav">
          <i class="fas fa-columns w-6"></i>
          <span>Dashboard</span>
        </button>
        <button data-section="modules"
          class="nav-item w-full flex items-center px-4 py-3 text-slate-600 rounded-lg hover:bg-slate-50 transition-colors">
          <i class="fas fa-book-open w-6"></i>
          <span>Modules</span>
        </button>
        <button data-section="labs"
          class="nav-item w-full flex items-center px-4 py-3 text-slate-600 rounded-lg hover:bg-slate-50 transition-colors">
          <i class="fas fa-vial w-6"></i>
          <span>Virtual Labs</span>
        </button>

        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 mt-8 px-2">Educator Tools</div>
        <button data-section="educator"
          class="nav-item w-full flex items-center px-4 py-3 text-slate-600 rounded-lg hover:bg-slate-50 transition-colors">
          <i class="fas fa-chalkboard-teacher w-6"></i>
          <span>SIMS Studio</span>
        </button>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
      <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 flex-shrink-0">
        <h2 id="page-title" class="text-lg font-semibold text-slate-800">Student Dashboard</h2>
      </header>

      <div id="content-area" class="flex-1 overflow-y-auto p-8 custom-scrollbar">
        <!-- Content handled by JavaScript -->
      </div>
    </main>
  </div>

  <!-- Viewer Overlay -->
  <div id="module-viewer"
    class="fixed inset-0 bg-white z-50 transform translate-y-full transition-transform duration-500 flex flex-col">
    <header class="h-16 border-b flex items-center justify-between px-8 bg-slate-50 flex-shrink-0">
      <div class="flex items-center space-x-4">
        <button id="close-viewer" class="p-2 hover:bg-slate-200 rounded-full"><i class="fas fa-times"></i></button>
        <div>
          <h3 id="view-module-title" class="font-bold text-slate-800">Module View</h3>
        </div>
      </div>
    </header>
    <div class="flex-1 flex overflow-hidden">
      <aside class="w-72 border-r bg-slate-50 flex flex-col">
        <div id="module-topics-nav" class="p-2 space-y-1 overflow-y-auto"></div>
        <div class="mt-auto p-4 border-t bg-white space-y-2">
          <button data-resource="checklist"
            class="resource-btn w-full flex items-center space-x-3 p-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100"><i
              class="fas fa-tasks w-4"></i><span>Checklist</span></button>
          <button data-resource="flashcards"
            class="resource-btn w-full flex items-center space-x-3 p-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100"><i
              class="fas fa-clone w-4"></i><span>Flashcards</span></button>
          <button data-resource="qbank"
            class="resource-btn w-full flex items-center space-x-3 p-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100"><i
              class="fas fa-question-circle w-4"></i><span>Question Bank</span></button>
        </div>
      </aside>
      <div id="module-html-content" class="flex-1 overflow-y-auto bg-white p-12 custom-scrollbar"></div>
    </div>
  </div>


</body>

</html>
